[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-research"
version = "0.1.1"
description = "One query, every search engine, in parallel — Exa, Perplexity, OpenAI, Gemini, and Claude, unified behind one interface with a built-in cost calculator."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Sanchit Monga" }]
keywords = ["search", "research", "llm", "agent", "exa", "perplexity", "openai", "gemini", "anthropic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
exa = ["exa-py>=1.10"]
perplexity = []  # uses httpx directly, no extra SDK
openai = ["openai>=1.50"]
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.40"]
all = ["argus-research[exa,openai,gemini,anthropic]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/sanchitmonga22/argus"
Repository = "https://github.com/sanchitmonga22/argus"

[project.scripts]
argus = "argus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real provider APIs, needs API keys, costs money — excluded by default"]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["src/argus"]
